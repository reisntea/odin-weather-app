<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75,100..900;1,75,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Weather</h1>
    <p>Enter a place (e.g. a city) below to get its current weather.</p>

    <form novalidate>
        <p>
            <label for="Place">
                <span>Place :</span>
                <input type="text" id="place" name="place" required />
            </label>
        </p>
        <p>
            <label for="unit">Unit: </label>
            <div>
                <input type="radio" id="fahrenheit" name="unit_type" value="fahrenheit" checked>
                <label for="fahrenheit">Fahrenheit</label>
            </div>
            <div>
                <input type="radio" id="celsius" name="unit_type" value="celsius">
                <label for="celsius">Celsius</label>
            </div>
        </p>
        <button>Enter</button>
    </form>

    <span class="error" aria-live="polite"></span>

    <div id="weather-container"></div>
</body>
</html>
