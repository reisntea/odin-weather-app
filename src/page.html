<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
</head>
<body>
    <h1>To-do List</h1>
    <div id="top-header">
        <p>Add, edit, or remove projects and the tasks assigned to each project.</p>
        <button id="reset">Reset To Default</button>
    </div>
    <div id="container">
        <div id="sidebar">

            <div id="projects">
            </div>

            <button command="show-modal" commandfor="project-dialog" id="project-button">Add Project</button>

            <dialog id="project-dialog">
                <h1>Add Project</h1>
                <form id="add-project">
                    <label for="name">Project Name:</label>
                    <input type="text" name="name" id="name" required>
                </form>
                <button id="submit-project" type="submit" form="add-project">Add Project</button>
                <button commandfor="project-dialog" command="close">Close</button>
            </dialog>
        </div>
        <div id="main-content">
            <div id="title-container">
                <h2 id="project-title"></h2>
                <button command="show-modal" commandfor="edit-project-dialog" id="open-edit-project-dialog">Edit Project Name</button>

                <dialog id="edit-project-dialog">
                    <h1>Edit Project</h1>
                    <form id="edit-project">
                        <label for="name-edit">Project Name:</label>
                        <input type="text" name="name-edit" id="name-edit" required>
                    </form>
                    <button id="submit-project-edit" type="submit" form="edit-project">Edit Project</button>
                    <button commandfor="edit-project-dialog" command="close">Close</button>
                </dialog>

                <button id="remove-project">Remove Project</button>
            </div>
            <div id="tasks">
            </div>
            <button command="show-modal" commandfor="add-task-dialog" id="add-task-button">Add Task</button>

            <dialog id="add-task-dialog">
                <h1>Add Task</h1>
                <form id="add-task">
                    <label for="title-add">Task Title:</label>
                    <input type="text" name="title-add" id="title-add" required>
                    <label for="date-add">Due Date: </label>
                    <input type="date" name="date-add" id="date-add" pattern="^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$" required>
                    <label for="priority-add">Priority: (1 to 5, with 1 meaning most prioritized)</label>
                    <input type="number" name="priority-add" id="priority-add" min="1" max="5" value="1" required>
                    <label for="description-add">Description: (200 character max)</label>
                    <textarea name="description-add" id="description-add" maxlength="200" rows="5" required></textarea>
                </form>
                <button id="submit-task" type="submit" form="add-task">Add Task</button>
                <button commandfor="add-task-dialog" command="close">Close</button>
            </dialog>

            <dialog id="edit-task-dialog">
                <h1>Edit Task</h1>
                <form id="edit-task">
                    <label for="title-edit">Task Title:</label>
                    <input type="text" name="title-edit" id="title-edit" required>
                    <label for="date-edit">Due Date: </label>
                    <input type="date" name="date-edit" id="date-edit" pattern="^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$" required>
                    <label for="priority-edit">Priority: (1 to 5, with 1 meaning most prioritized)</label>
                    <input type="number" name="priority-edit" id="priority-edit" min="1" max="5" value="1" required>
                    <label for="description-edit">Description: (200 character max)</label>
                    <textarea name="description-edit" id="description-edit" maxlength="200" rows="5" required></textarea>
                </form>
                <button id="submit-task-edit" type="submit" form="edit-task">Edit Task</button>
                <button commandfor="edit-task-dialog" command="close">Close</button>
            </dialog>
        </div>
    </div>
</body>
</html>
